name: Ekans shiny

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/ekans-dark.svg?palette=github-dark&color_snake=#dea452&color_dots=#161b22,#396a00,#6a9c41,#9cc54a,#e6dede
            dist/ekans.svg?color_snake=#b48339&color_dots=#ebedf0,#c6e48b,#9cc54a,#6a9c41,#396a00

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
