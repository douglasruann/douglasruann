<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Pokédex Nº105, Douglas Ruan, o Pokémon Guardião do Código"><style>@font-face{font-family:'PS2P';src:url(data:font/woff2;base64,) format('woff2');}.px{font-family:'PS2P',monospace;}
